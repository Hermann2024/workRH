spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${WORKRH_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: 127.0.0.1:19092
    consumer:
      auto-offset-reset: earliest

security:
  demo-authentication-enabled: ${WORKRH_DEMO_AUTHENTICATION_ENABLED:false}
  jwt:
    secret: ${WORKRH_JWT_SECRET}
    expiration: 86400

workrh:
  production-readiness:
    enforced: ${WORKRH_PRODUCTION_READINESS_ENFORCED:false}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9761/eureka

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

subscription:
  service:
    base-url: http://localhost:9087

stripe:
  base-url: https://api.stripe.com
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:}
  prices:
    starter: ${STRIPE_PRICE_STARTER:}
    pro: ${STRIPE_PRICE_PRO:}
    premium: ${STRIPE_PRICE_PREMIUM:}
    enterprise: ${STRIPE_PRICE_ENTERPRISE:}
    sms-option: ${STRIPE_PRICE_SMS_OPTION:}
    advanced-audit-option: ${STRIPE_PRICE_ADVANCED_AUDIT_OPTION:}
    advanced-export-option: ${STRIPE_PRICE_ADVANCED_EXPORT_OPTION:}
