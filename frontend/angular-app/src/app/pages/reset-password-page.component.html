<section class="login-layout">
  <article class="login-intro panel">
    <p class="section-tag">{{ 'reset.security_tag' | t }}</p>
    <h2>{{ 'reset.intro_title' | t }}</h2>
    <div class="login-points">
      <div class="login-point">
        <strong>{{ 'reset.once_title' | t }}</strong>
        <span>{{ 'reset.once_body' | t }}</span>
      </div>
      <div class="login-point">
        <strong>{{ 'reset.auto_title' | t }}</strong>
        <span>{{ 'reset.auto_body' | t }}</span>
      </div>
    </div>
  </article>

  <section class="panel login-panel">
    <div class="login-panel-head">
      <div>
        <p class="section-tag">{{ 'reset.account_tag' | t }}</p>
        <h2>{{ 'reset.title' | t }}</h2>
      </div>
    </div>

    <div class="error-message" *ngIf="errorMessage()">{{ errorMessage() }}</div>

    <form [formGroup]="passwordForm" (ngSubmit)="submit()" class="login-form">
      <label class="login-field">
        <span>{{ 'reset.new_password' | t }}</span>
        <input type="password" formControlName="password" autocomplete="new-password">
      </label>
      <label class="login-field">
        <span>{{ 'reset.confirm' | t }}</span>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password">
      </label>
      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? ('reset.submitting' | t) : ('reset.submit' | t) }}
      </button>
    </form>

    <p class="hint auth-switch-copy">
      <a routerLink="/login">{{ 'common.back_login' | t }}</a>
    </p>
  </section>
</section>
